<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>History</title>
    </head>
    <body>
        <h1>Calculation History</h1>
        <table border="1">
            <tr>
                <th>ID</th>
                <th>User</th>
                <th>Image</th>
                <th>Measured(mm)</th>
                <th>Real(mm)</th>
                <th>Unit</th>
                <th>Time</th>
                <th>Action</th>
            </tr>
            {% for r in rows %}
            <tr>
                <td>{{r[0]}}</td>
                <td>{{r[1]}}</td>
                <td>
                    {% if r[2] %}<a
                        href="/uploads/{{r[2]|replace('\\','/')|split('/')[-1]}}"
                        >image</a
                    >{% else %} - {% endif %}
                </td>
                <td>{{r[3]}}</td>
                <td>{{'%.6g'|format(r[4])}}</td>
                <td>{{r[5]}}</td>
                <td>{{r[6]}}</td>
                <td><a href="/delete/{{r[0]}}">Delete</a></td>
            </tr>
            {% endfor %}
        </table>
        <p><a href="/">Back</a></p>
    </body>
</html>
